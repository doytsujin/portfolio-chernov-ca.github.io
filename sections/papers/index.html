<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papers — Alexander Chernov</title>
    <meta name="description" content="Abstracts of published research by Alexander Chernov. Full papers are at the publisher.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Papers — Alexander Chernov">
    <meta property="og:description" content="Abstracts of published research by Alexander Chernov. Full papers are at the publisher.">
    <meta property="og:url" content="https://portfolio.chernov.ca/papers/">
    <meta property="og:image" content="https://portfolio.chernov.ca/og/papers.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Papers: abstracts of published research by Alexander Chernov">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg: #e8e8e8;
            --header-color: #1a1a1a;
            --header-sub-color: #666666;
            --card-bg: #ffffff;
            --card-border: #d0d0d0;
            --card-body-bg: #f7f7f7;
            --card-shadow: rgba(0, 0, 0, 0.06);
            --card-shadow-hover: rgba(0, 0, 0, 0.14);
            --card-header-bg: linear-gradient(135deg, #2a2a2a 0%, #3d3d3d 100%);
            --card-header-color: #ffffff;
            --card-body-color: #4a4a4a;
            --btn-primary-bg: #2a2a2a;
            --btn-primary-color: #ffffff;
            --btn-primary-border: #2a2a2a;
            --btn-secondary-bg: #ffffff;
            --btn-secondary-color: #333333;
            --btn-secondary-border: #999999;
            --btn-secondary-hover-bg: #ebebeb;
            --footer-color: #666666;
            --footer-border: #c8c8c8;
            --footer-link: #333333;
            --badge-bg: #2a2a2a;
            --badge-color: #ffffff;
        }

        html.dark {
            --bg: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --header-color: #ffffff;
            --header-sub-color: #b0c4ce;
            --card-bg: #1a2e38;
            --card-border: transparent;
            --card-body-bg: #1a2e38;
            --card-shadow: rgba(0, 0, 0, 0.3);
            --card-shadow-hover: rgba(0, 0, 0, 0.45);
            --card-header-bg: linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
            --card-header-color: #ffffff;
            --card-body-color: #b0c4ce;
            --btn-primary-bg: linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
            --btn-primary-color: #ffffff;
            --btn-primary-border: #3a7a94;
            --btn-secondary-bg: #1a2e38;
            --btn-secondary-color: #8cc4d8;
            --btn-secondary-border: #3a7a94;
            --btn-secondary-hover-bg: #243e4a;
            --footer-color: #d0dde3;
            --footer-border: rgba(255, 255, 255, 0.2);
            --footer-link: #8cc4d8;
            --badge-bg: #3a7a94;
            --badge-color: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .container { max-width: 900px; width: 100%; }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2em;
            font-weight: 700;
            color: var(--header-color);
            margin-bottom: 6px;
        }

        .header p {
            color: var(--header-sub-color);
            font-size: 1em;
        }

        .header .back-link {
            display: inline-block;
            margin-top: 8px;
            color: var(--footer-link);
            text-decoration: none;
            font-size: 0.9em;
        }
        .header .back-link:hover { text-decoration: underline; }

        .paper-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px var(--card-shadow);
            transition: box-shadow 0.3s ease, transform 0.2s ease;
            margin-bottom: 20px;
        }
        .paper-card:hover {
            box-shadow: 0 4px 16px var(--card-shadow-hover);
            transform: translateY(-2px);
        }

        .paper-card-header {
            background: var(--card-header-bg);
            padding: 16px 20px;
        }
        .paper-card-header h2 {
            color: var(--card-header-color);
            font-size: 1.05em;
            font-weight: 600;
            line-height: 1.4;
        }

        .paper-card-body {
            padding: 16px 20px;
            background: var(--card-body-bg);
        }

        .paper-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
            font-size: 0.85em;
        }

        .badge {
            background: var(--badge-bg);
            color: var(--badge-color);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .paper-abstract {
            color: var(--card-body-color);
            font-size: 0.92em;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .paper-citation {
            color: var(--card-body-color);
            font-size: 0.84em;
            line-height: 1.45;
            opacity: 0.85;
            margin-bottom: 14px;
        }

        .paper-note {
            color: var(--card-body-color);
            font-size: 0.84em;
            opacity: 0.7;
            align-self: center;
        }

        .paper-links { display: flex; gap: 10px; align-items: center; }

        .btn {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.88em;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid;
        }
        .btn-primary {
            background: var(--btn-primary-bg);
            color: var(--btn-primary-color);
            border-color: var(--btn-primary-border);
        }
        .btn-primary:hover { opacity: 0.85; }
        .btn-secondary {
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-color);
            border-color: var(--btn-secondary-border);
        }
        .btn-secondary:hover { background: var(--btn-secondary-hover-bg); }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid var(--footer-border);
            color: var(--footer-color);
            font-size: 0.85em;
        }
        .footer a { color: var(--footer-link); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px var(--card-shadow);
            transition: background 0.3s;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌓</button>
    <div class="container">
        <div class="header">
            <h1>Papers</h1>
            <p>Abstracts of published research. Full papers are at the publisher.</p>
            <a class="back-link" href="https://chernov.ca/">← Alexander Chernov</a>
        </div>

        <!-- {{PAPER_CARDS}} -->

        <div class="footer">
            <p>Alexander Chernov · <a href="https://orcid.org/0009-0007-3198-2712">ORCID</a> · <a href="https://github.com/doytsujin">GitHub</a> · <a href="https://chernov.ca/legal.html">Terms</a></p>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
